[package]
name = "tiecamel-governance"
version = "0.1.0"
description = "Non-custodial critical-obligation governance and reporting commitments"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tiecamel_governance"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=0.31.1"
